# Execute GPc/*.ipynb against a pinned gpc wheel (CIP-0007).
#
# Pin: TestPyPI gpc==0.1.0a10 until the first PyPI release (GPc CIP-002C).
# Keep --extra-index-url on real PyPI so NumPy resolves.
#
# Soft path filter: only GPc tree + this runner. workflow_dispatch always runs.
name: GPc tutorials

on:
  push:
    branches: [master, main]
    paths:
      - "GPc/**"
      - "scripts/run_gpc_tutorials.py"
      - "scripts/run_gpc_tutorials.sh"
      - ".github/workflows/gpc-tutorials.yml"
  pull_request:
    paths:
      - "GPc/**"
      - "scripts/run_gpc_tutorials.py"
      - "scripts/run_gpc_tutorials.sh"
      - ".github/workflows/gpc-tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gpc (TestPyPI alpha), matplotlib, pods, Jupyter
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "gpc==0.1.0a10"
          python -m pip install nbclient ipykernel jupyter_client matplotlib pods scipy
          python -c "import gpc; print('gpc', getattr(gpc, '__version__', '?'), gpc.__file__)"
          export OPENBLAS_NUM_THREADS=1

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute GPc tutorials
        run: bash scripts/run_gpc_tutorials.sh --output-dir executed-gpc

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-gpc-notebooks
          path: executed-gpc/
          if-no-files-found: ignore
