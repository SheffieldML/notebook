# Execute GPy/*.ipynb against a pinned GPy (CIP-0003).
#
# GPy pin: SheffieldML/GPy main until CIP-0014 (SkewGaussian) ships on PyPI
# (see installs.yml). Revert to a PyPI pin after the next GPy release.
#
# Default package sources: lamd shared catalog (lawrennd/lamd CIP-001C).
# This repo's installs.yml holds profiles, pins, and temporary overrides
# (scripts/install_from_yaml.py). Switch pods/GPy there — not in this workflow.
#
# East Timor in GPyCrashCourse is loaded from datasets_mirror (older PyPI pods
# builds may not yet ship pods.datasets.east_timor).
#
# Python 3.11: climin 0.1a1 still imports the removed stdlib module `imp`.
# pods first-time downloads are authorized in the runner (no stdin in nbclient).
#
# climin is installed so SVI.ipynb and optimizer-implementation.ipynb are
# required (CIP-0003 skip only applies when the extra is absent).
#
# execute-latest uses profile gpy-tutorials-latest (unpinned GPy).
name: GPy tutorials

on:
  push:
    branches: [master, main]
    paths:
      - "GPy/**"
      - "installs.yml"
      - "scripts/install_from_yaml.py"
      - "scripts/run_gpy_tutorials.py"
      - "scripts/run_gpy_tutorials.sh"
      - ".github/workflows/gpy-tutorials.yml"
  pull_request:
    paths:
      - "GPy/**"
      - "installs.yml"
      - "scripts/install_from_yaml.py"
      - "scripts/run_gpy_tutorials.py"
      - "scripts/run_gpy_tutorials.sh"
      - ".github/workflows/gpy-tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tutorial dependencies (installs.yml)
        run: |
          python -m pip install --upgrade pip pyyaml
          python scripts/install_from_yaml.py --profile gpy-tutorials
          python -c "import GPy, pods, climin; print('GPy', getattr(GPy, '__version__', '?')); print('pods', pods.__file__); print('f1 loader', hasattr(pods.datasets, 'f1_2011_practice_qualifying')); print('climin', climin.__file__)"

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute GPy tutorials
        run: bash scripts/run_gpy_tutorials.sh --output-dir executed-gpy

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-gpy-notebooks
          path: executed-gpy/
          if-no-files-found: ignore

  execute-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tutorial dependencies (installs.yml latest)
        run: |
          python -m pip install --upgrade pip pyyaml
          python scripts/install_from_yaml.py --profile gpy-tutorials-latest
          python -c "import GPy, pods, climin; print('GPy', getattr(GPy, '__version__', '?')); print('pods', pods.__file__); print('f1 loader', hasattr(pods.datasets, 'f1_2011_practice_qualifying')); print('climin', climin.__file__)"

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute GPy tutorials
        run: bash scripts/run_gpy_tutorials.sh --output-dir executed-gpy-latest

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-gpy-latest-notebooks
          path: executed-gpy-latest/
          if-no-files-found: ignore
