# Consumer install profiles for tutorial / CI environments.
#
# Default package sources live in lamd's shared catalog (CIP-001C / notebook
# CIP-0008):
#   https://raw.githubusercontent.com/lawrennd/lamd/main/lamd/installs/packages.yml
#
# Resolution per package name:
#   profile pins > overrides.packages > catalog > bare name
#
# Usage:
#   python scripts/install_from_yaml.py --profile gpy-tutorials
#   python scripts/install_from_yaml.py --profile gpy-tutorials-latest --dry-run
#
# Offline / against a local lamd checkout:
#   export LAMD_PACKAGES_YML=/path/to/lamd/lamd/installs/packages.yml
# or set catalog.local below.

catalog:
  url: https://raw.githubusercontent.com/lawrennd/lamd/main/lamd/installs/packages.yml
  # local: ../lamd/lamd/installs/packages.yml

# Temporary until GPy CIP-0014 / pods F1 loader are on the default catalog / PyPI.
overrides:
  packages:
    # f1_2011_practice_qualifying is on ods main; not yet on PyPI pods.
    pods: "pods @ git+https://github.com/lawrennd/ods.git"
    # CIP-0014 skew + infer_newX ndarray fix; not yet in PyPI 1.15.0.
    GPy: "GPy[plotting] @ git+https://github.com/SheffieldML/GPy.git@fix/infer-newx-ndarray"

default_profile: gpy-tutorials

profiles:
  gpy-tutorials:
    description: >
      GPy from fix/infer-newx-ndarray (CIP-0014 skew + infer_newX ndarray fix) until merged/released.
      pods override points at ods main until the F1 loader is on the shared
      catalog / PyPI.
    packages:
      - GPy
      - pods
      - nbclient
      - ipykernel
      - jupyter_client
      - ipywidgets
      - seaborn
      - pandas
      - climin
    pins:
      GPy: "GPy[plotting] @ git+https://github.com/SheffieldML/GPy.git@fix/infer-newx-ndarray"

  gpy-tutorials-latest:
    description: >
      Unpinned GPy canary (also CIP-0014 main until skew ships on PyPI). Same
      pods override as gpy-tutorials until the F1 loader is on PyPI.
    packages:
      - GPy
      - pods
      - nbclient
      - ipykernel
      - jupyter_client
      - ipywidgets
      - seaborn
      - pandas
      - climin
    pins:
      GPy: "GPy[plotting] @ git+https://github.com/SheffieldML/GPy.git@fix/infer-newx-ndarray"
